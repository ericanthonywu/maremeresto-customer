<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Maremè Group — Pesan Kopi &amp; Makanan Hangat</title>
    <meta name="description" content="Pesan kopi dan makanan hangat langsung dari Maremè Group (Maremè Kerten, Maremè Makamhaji, dan Mak Djan). Tersedia layanan Dine-In, Takeaway, dan Delivery." />
    <meta name="theme-color" content="#c87028" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <style>
      /* Critical inline splash screen rendered immediately before JS bundle loads */
      #pwa-splash-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #faf7f2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-family: 'Nunito Sans', system-ui, -apple-system, sans-serif;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #pwa-splash-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-cup {
        position: relative;
        width: 88px;
        height: 88px;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 10px 25px -5px rgba(200, 112, 40, 0.12), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        border: 1px solid #fef3c7;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease;
      }
      .splash-cup:active {
        transform: scale(0.92);
      }
      .splash-steam {
        position: absolute;
        top: 10px;
        display: flex;
        gap: 6px;
      }
      .splash-steam span {
        width: 4px;
        height: 10px;
        background: #f59e0b;
        border-radius: 99px;
        animation: splashSteam 1.2s infinite ease-in-out;
      }
      .splash-steam span:nth-child(2) { animation-delay: 0.2s; height: 14px; }
      .splash-steam span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splashSteam {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(-5px); opacity: 0.9; }
      }
      .splash-title {
        font-family: Georgia, serif;
        font-weight: 700;
        font-size: 22px;
        color: #78350f;
        margin: 0 0 6px;
      }
      .splash-tip {
        font-size: 13px;
        color: #78716c;
        max-width: 280px;
        line-height: 1.5;
        margin: 0 0 10px;
        min-height: 38px;
      }
      .splash-hint {
        font-size: 11px;
        color: #d97706;
        font-weight: 600;
        margin: 0;
      }
      .splash-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #c87028;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        display: none;
      }
      .splash-reload {
        margin-top: 20px;
        padding: 8px 16px;
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        font-size: 12px;
        color: #57534e;
        font-weight: 600;
        cursor: pointer;
        display: none;
      }
      .splash-reload.visible {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Instant HTML Splash Screen rendered while JS bundle downloads -->
    <div id="pwa-splash-loader" role="status" aria-label="Memuat aplikasi">
      <div class="splash-cup" id="splash-cup-btn" title="Tap untuk aduk!">
        <div class="splash-steam"><span></span><span></span><span></span></div>
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#c87028" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
        <span class="splash-badge" id="splash-badge">0</span>
      </div>
      <h1 class="splash-title">Maremè Group</h1>
      <p class="splash-tip" id="splash-tip">Menyiapkan menu kopi &amp; makanan hangat untukmu...</p>
      <p class="splash-hint">💡 Tap cangkir kopi di atas sambil menunggu</p>
      <button type="button" class="splash-reload" id="splash-reload-btn" onclick="window.location.reload()">
        Loading agak lama? Tap di sini untuk muat ulang
      </button>
    </div>

    <script>
      (function() {
        var tips = [
          'Menyiapkan menu kopi & makanan hangat untukmu...',
          'Soto & hidangan Mareme diracik dengan bumbu rempah autentik khas Solo.',
          'Kopi susu Mareme diseduh fresh saat pesanan diterima.',
          'Menghubungkan ke dapur cabang Maremè terdekat...',
        ];
        var idx = 0;
        var stirCount = 0;
        var tipEl = document.getElementById('splash-tip');
        var cupEl = document.getElementById('splash-cup-btn');
        var badgeEl = document.getElementById('splash-badge');
        var reloadBtn = document.getElementById('splash-reload-btn');

        var tipTimer = setInterval(function() {
          idx = (idx + 1) % tips.length;
          if (tipEl) tipEl.textContent = tips[idx];
        }, 2800);

        if (cupEl) {
          cupEl.addEventListener('click', function() {
            stirCount++;
            cupEl.style.transform = 'rotate(' + (stirCount * 20) + 'deg) scale(0.95)';
            setTimeout(function() {
              cupEl.style.transform = 'rotate(' + (stirCount * 20) + 'deg)';
            }, 120);
            if (badgeEl) {
              badgeEl.textContent = '+' + stirCount;
              badgeEl.style.display = 'inline-block';
            }
          });
        }

        // Show reload button if JS takes > 6 seconds
        var reloadTimer = setTimeout(function() {
          if (reloadBtn) reloadBtn.classList.add('visible');
        }, 6000);

        window.dismissPWALoader = function() {
          clearInterval(tipTimer);
          clearTimeout(reloadTimer);
          var loader = document.getElementById('pwa-splash-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function() {
              if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
            }, 350);
          }
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
